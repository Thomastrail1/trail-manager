<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trail Manager</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="app">

        <header class="topbar">
            <div>
                <span class="eyebrow">SAISON 01</span>
                <h1>Trail Manager</h1>
            </div>

            <div class="profile-icon">
                🏃
            </div>
        </header>


        <section class="hero">

            <div class="mountain">
                🏔️
            </div>

            <div class="hero-content">

                <span class="eyebrow">TON AVENTURE COMMENCE</span>

                <h2>
                    De coureur amateur<br>
                    à légende du trail.
                </h2>

                <p>
                    Entraîne ton coureur, prépare tes courses
                    et construis ta carrière.
                </p>

                <button id="startButton" class="primary-button">
                    CRÉER MON COUREUR
                </button>

            </div>

        </section>


        <section class="stats-preview">

            <div class="stat-card">
                <span>🏃</span>
                <strong>0</strong>
                <small>Courses</small>
            </div>

            <div class="stat-card">
                <span>🏆</span>
                <strong>0</strong>
                <small>Victoires</small>
            </div>

            <div class="stat-card">
                <span>⛰️</span>
                <strong>0</strong>
                <small>D+ parcouru</small>
            </div>

        </section>


        <nav class="bottom-nav">

            <button class="nav-item active">
                🏠
                <span>Accueil</span>
            </button>

            <button class="nav-item">
                🏃
                <span>Coureur</span>
            </button>

            <button class="nav-item">
                🏔️
                <span>Courses</span>
            </button>

            <button class="nav-item">
                👥
                <span>Club</span>
            </button>

        </nav>

    </main>


    <script src="js/main.js"></script>

</body>
</html>
